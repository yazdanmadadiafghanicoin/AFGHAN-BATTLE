
<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>AFGHAN BATTLE</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#263d28;color:white;font-family:Arial;touch-action:none}
canvas{display:block}
#hud{position:absolute;top:12px;left:10px;right:10px;display:flex;justify-content:space-between;z-index:3;pointer-events:none}
.panel{background:#111c;padding:10px;border-radius:10px;font-size:14px;line-height:1.7}
#health{color:#5cff70}
#joy{position:absolute;bottom:25px;left:20px;width:120px;height:120px;border:2px solid #fff9;border-radius:50%;background:#ffffff22;z-index:5;touch-action:none}
#stick{position:absolute;left:35px;top:35px;width:46px;height:46px;border-radius:50%;background:#fff9}
#fire{position:absolute;right:25px;bottom:40px;width:85px;height:85px;border-radius:50%;background:#c22;color:white;border:3px solid white;font-weight:bold;font-size:18px;z-index:5}
#look{position:absolute;right:0;top:100px;width:48%;height:45%;z-index:2;touch-action:none}
#cross{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:28px;text-shadow:0 0 5px black;pointer-events:none}
#msg{position:absolute;top:43%;width:100%;text-align:center;font-size:25px;text-shadow:0 2px 5px black;z-index:6;pointer-events:none}
#restart{display:none;position:absolute;top:55%;left:50%;transform:translateX(-50%);padding:15px 25px;border:0;border-radius:10px;background:orange;font-size:18px;z-index:7}
#error{position:absolute;top:40%;padding:20px;color:white;background:#8b0000;display:none;z-index:20}
</style>
</head>
<body>

<div id="hud">
 <div class="panel">
  🇦🇫 <b>AFGHAN BATTLE</b><br>
  <span id="health">❤️ 100</span><br>
  <span id="state">آماده جنگ</span>
 </div>
 <div class="panel">
  دشمن: <span id="kills">0</span><br>
  مهمات: <span id="ammo">30</span><br>
  اسلحه: AK-47
 </div>
</div>

<div id="cross">+</div>
<div id="msg">AFGHAN BATTLE</div>
<div id="error"></div>
<button id="restart" onclick="location.reload()">شروع دوباره</button>
<div id="joy"><div id="stick"></div></div>
<div id="look"></div>
<button id="fire">FIRE</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
(function(){

const error=document.getElementById("error");

if(!window.THREE){
 error.style.display="block";
 error.innerText="موتور سه بعدی بارگذاری نشد. اینترنت را بررسی کن.";
 return;
}

try{

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x9bb8ca);
scene.fog=new THREE.Fog(0x9bb8ca,55,180);

const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,300);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x53613b,2));

const sun=new THREE.DirectionalLight(0xffffff,2);
sun.position.set(-30,60,30);
scene.add(sun);

// زمین
const ground=new THREE.Mesh(
 new THREE.PlaneGeometry(300,300),
 new THREE.MeshStandardMaterial({color:0x747b4b})
);
ground.rotation.x=-Math.PI/2;
scene.add(ground);

// ساختمان
function cube(x,y,z,w,h,d,color){
 const m=new THREE.Mesh(
  new THREE.BoxGeometry(w,h,d),
  new THREE.MeshStandardMaterial({color})
 );
 m.position.set(x,y,z);
 scene.add(m);
 return m;
}

for(let i=0;i<22;i++){
 let x=(Math.random()-.5)*110;
 let z=(Math.random()-.5)*110;
 if(Math.abs(x)<15&&Math.abs(z)<15)continue;
 cube(x,2,z,7,4,7,0xb4a184);
 cube(x,4.2,z,7.2,.4,7.2,0x62503c);
}

// درخت‌ها
for(let i=0;i<65;i++){
 let x=(Math.random()-.5)*130;
 let z=(Math.random()-.5)*130;
 if(Math.abs(x)<15&&Math.abs(z)<15)continue;
 cube(x,1,z,.7,2,.7,0x65462a);
 const t=new THREE.Mesh(
  new THREE.ConeGeometry(2.3,6,7),
  new THREE.MeshStandardMaterial({color:0x315b32})
 );
 t.position.set(x,4,z);
 scene.add(t);
}

// سرباز
const player=new THREE.Group();

const body=new THREE.Mesh(
 new THREE.CylinderGeometry(.5,.6,1.3,12),
 new THREE.MeshStandardMaterial({color:0x354b2d})
);
body.position.y=1.1;
player.add(body);

const head=new THREE.Mesh(
 new THREE.SphereGeometry(.32,12,12),
 new THREE.MeshStandardMaterial({color:0xc99570})
);
head.position.y=2;
player.add(head);

const helmet=new THREE.Mesh(
 new THREE.SphereGeometry(.36,12,8,0,Math.PI*2,0,Math.PI/2),
 new THREE.MeshStandardMaterial({color:0x354b2d})
);
helmet.position.y=2.1;
player.add(helmet);

const weapon=new THREE.Mesh(
 new THREE.BoxGeometry(.15,.15,1.1),
 new THREE.MeshStandardMaterial({color:0x222222})
);
weapon.position.set(.35,1.3,-.6);
player.add(weapon);

scene.add(player);

// دشمنان
const enemies=[];

function newEnemy(){
 const e=new THREE.Group();

 const b=new THREE.Mesh(
  new THREE.CylinderGeometry(.5,.55,1.3,12),
  new THREE.MeshStandardMaterial({color:0x9e2920})
 );
 b.position.y=1.1;
 e.add(b);

 const h=new THREE.Mesh(
  new THREE.SphereGeometry(.3,12,12),
  new THREE.MeshStandardMaterial({color:0xb98a69})
 );
 h.position.y=2;
 e.add(h);

 e.position.set(
  (Math.random()-.5)*90,
  0,
  (Math.random()-.5)*90
 );

 if(e.position.length()<20)e.position.x+=35;
 scene.add(e);
 enemies.push(e);
}

for(let i=0;i<10;i++)newEnemy();

// وضعیت
let health=100,ammo=30,kills=0;
let dead=false,moveX=0,moveY=0;
let angle=0,lastShot=0;

const joy=document.getElementById("joy");
const stick=document.getElementById("stick");
const look=document.getElementById("look");

function joystick(e){
 const r=joy.getBoundingClientRect();
 let dx=e.clientX-(r.left+r.width/2);
 let dy=e.clientY-(r.top+r.height/2);
 let d=Math.min(43,Math.hypot(dx,dy));
 let a=Math.atan2(dy,dx);
 moveX=Math.cos(a)*d/43;
 moveY=Math.sin(a)*d/43;
 stick.style.left=(35+moveX*43)+"px";
 stick.style.top=(35+moveY*43)+"px";
}

joy.addEventListener("pointerdown",e=>{
 joy.setPointerCapture(e.pointerId);
 joystick(e);
});
joy.addEventListener("pointermove",e=>{
 if(e.buttons)joystick(e);
});

function resetJoy(){
 moveX=0;moveY=0;
 stick.style.left="35px";
 stick.style.top="35px";
}
joy.addEventListener("pointerup",resetJoy);
joy.addEventListener("pointercancel",resetJoy);

// چرخش دوربین
let looking=false,oldX=0;
look.addEventListener("pointerdown",e=>{
 looking=true;
 oldX=e.clientX;
 look.setPointerCapture(e.pointerId);
});
look.addEventListener("pointermove",e=>{
 if(!looking)return;
 angle-=(e.clientX-oldX)*.008;
 oldX=e.clientX;
});
look.addEventListener("pointerup",()=>looking=false);
look.addEventListener("pointercancel",()=>looking=false);

// تیراندازی
const ray=new THREE.Raycaster();

function shoot(){
 if(dead||ammo<=0)return;
 if(performance.now()-lastShot<350)return;
 lastShot=performance.now();
 ammo--;
 document.getElementById("ammo").textContent=ammo;

 ray.setFromCamera(new THREE.Vector2(0,0),camera);

 let targets=[];
 enemies.forEach(e=>e.children.forEach(c=>targets.push(c)));

 let hits=ray.intersectObjects(targets);

 if(hits.length){
  let enemy=enemies.find(e=>e.children.includes(hits[0].object));
  if(enemy){
   scene.remove(enemy);
   enemies.splice(enemies.indexOf(enemy),1);
   kills++;
   document.getElementById("kills").textContent=kills;
   document.getElementById("state").textContent="دشمن نابود شد";
   if(enemies.length<10&&kills<30)newEnemy();
  }
 }
}

document.getElementById("fire").addEventListener("pointerdown",e=>{
 e.preventDefault();
 shoot();
});

// پایان بازی
function gameOver(){
 dead=true;
 document.getElementById("msg").textContent="GAME OVER";
 document.getElementById("restart").style.display="block";
}

// حلقه بازی
const clock=new THREE.Clock();

function animate(){
 requestAnimationFrame(animate);
 const dt=Math.min(clock.getDelta(),.05);

 if(!dead){

  const forward=new THREE.Vector3(
   -Math.sin(angle),0,-Math.cos(angle)
  );
  const right=new THREE.Vector3(
   Math.cos(angle),0,-Math.sin(angle)
  );

  player.position.addScaledVector(right,moveX*8*dt);
  player.position.addScaledVector(forward,moveY*8*dt);

  player.position.x=THREE.MathUtils.clamp(player.position.x,-140,140);
  player.position.z=THREE.MathUtils.clamp(player.position.z,-140,140);

  if(Math.abs(moveX)+Math.abs(moveY)>.1){
   player.rotation.y=Math.atan2(-moveX,-moveY)+angle;
  }

  enemies.forEach(e=>{
   const v=new THREE.Vector3().subVectors(player.position,e.position);
   const distance=v.length();

   if(distance>1.8){
    v.normalize();
    e.position.addScaledVector(v,2*dt);
    e.rotation.y=Math.atan2(-v.x,-v.z);
   }else{
    health=Math.max(0,health-12*dt);
    document.getElementById("health").textContent="❤️ "+Math.floor(health);
    if(health<=0)gameOver();
   }
  });
 }

 const offset=new THREE.Vector3(
  Math.sin(angle)*9,5,Math.cos(angle)*9
 );

 camera.position.lerp(player.position.clone().add(offset),.15);
 camera.lookAt(player.position.x,player.position.y+1.4,player.position.z);

 renderer.render(scene,camera);
}

animate();

document.getElementById("msg").style.display="none";

addEventListener("resize",()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});

}catch(e){
 error.style.display="block";
 error.innerText="خطای بازی: "+e.message;
}

})();
</script>
</body>
</html>
