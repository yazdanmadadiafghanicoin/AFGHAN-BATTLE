
<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>AFGHAN BATTLE</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#111;font-family:Arial;color:white;touch-action:none}
canvas{display:block}
#hud{position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;z-index:5;pointer-events:none}
.panel{background:#101c;padding:10px;border-radius:10px;font-size:13px;line-height:1.8}
#health{color:#5dff71}
#joy{position:absolute;bottom:25px;left:18px;width:120px;height:120px;border:2px solid #ffffff88;border-radius:50%;background:#ffffff22;z-index:6;touch-action:none}
#stick{position:absolute;left:35px;top:35px;width:46px;height:46px;border-radius:50%;background:#ffffffcc}
#fire{position:absolute;bottom:40px;right:22px;width:85px;height:85px;border-radius:50%;background:#c21f20;border:3px solid white;color:white;font-size:18px;font-weight:bold;z-index:7}
#look{position:absolute;right:0;top:100px;width:48%;height:45%;z-index:2;touch-action:none}
#cross{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:28px;text-shadow:0 0 5px black;pointer-events:none}
#message{position:absolute;top:43%;width:100%;text-align:center;font-size:20px;text-shadow:0 2px 5px black;z-index:10;pointer-events:none;padding:10px}
#restart{display:none;position:absolute;top:56%;left:50%;transform:translateX(-50%);padding:15px 25px;background:orange;border:0;border-radius:10px;font-size:18px;z-index:11}
#loading{position:absolute;top:45%;width:100%;text-align:center;padding:15px;color:white;z-index:15}
#reload{position:absolute;right:125px;bottom:55px;background:#222c;color:white;border:1px solid white;padding:12px;border-radius:10px;z-index:7}
</style>
</head>
<body>

<div id="loading">در حال بارگذاری سرباز نظامی...</div>

<div id="hud">
 <div class="panel">
  🇦🇫 <b>AFGHAN BATTLE</b><br>
  <span id="health">❤️ 100</span><br>
  <span id="status">آماده جنگ</span>
 </div>
 <div class="panel">
  دشمنان: <span id="kills">0</span><br>
  مهمات: <span id="ammo">30</span><br>
  AK-47
 </div>
</div>

<div id="cross">+</div>
<div id="message"></div>
<div id="joy"><div id="stick"></div></div>
<div id="look"></div>
<button id="fire">FIRE</button>
<button id="reload">RELOAD</button>
<button id="restart" onclick="location.reload()">شروع دوباره</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/utils/SkeletonUtils.js"></script>

<script>
(function(){

const $=id=>document.getElementById(id);
const loading=$("loading");
const message=$("message");

if(!window.THREE || !THREE.GLTFLoader){
 loading.textContent="خطا در بارگذاری موتور سه‌بعدی. اینترنت را بررسی کن.";
 return;
}

try{

// تنظیمات بازی
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x9bb7c6);
scene.fog=new THREE.Fog(0x9bb7c6,65,190);

const camera=new THREE.PerspectiveCamera(
 65,innerWidth/innerHeight,.1,300
);

const renderer=new THREE.WebGLRenderer({
 antialias:true,
 powerPreference:"high-performance"
});

renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.shadowMap.enabled=true;
document.body.appendChild(renderer.domElement);

// نورپردازی
scene.add(new THREE.HemisphereLight(0xffffff,0x52603d,2));

const sun=new THREE.DirectionalLight(0xffffff,2);
sun.position.set(-40,70,30);
sun.castShadow=true;
sun.shadow.mapSize.set(1024,1024);
scene.add(sun);

// زمین
const ground=new THREE.Mesh(
 new THREE.PlaneGeometry(300,300),
 new THREE.MeshStandardMaterial({color:0x777c4b})
);
ground.rotation.x=-Math.PI/2;
ground.receiveShadow=true;
scene.add(ground);

// ساخت ساختمان
function makeBox(x,y,z,w,h,d,color){
 const obj=new THREE.Mesh(
  new THREE.BoxGeometry(w,h,d),
  new THREE.MeshStandardMaterial({color})
 );
 obj.position.set(x,y,z);
 obj.castShadow=true;
 obj.receiveShadow=true;
 scene.add(obj);
 return obj;
}

for(let i=0;i<28;i++){
 const x=(Math.random()-.5)*125;
 const z=(Math.random()-.5)*125;

 if(Math.hypot(x,z)<18)continue;

 const w=5+Math.random()*4;
 const h=3+Math.random()*2;

 makeBox(x,h/2,z,w,h,w,0xb9a483);
 makeBox(x,h+.15,z,w+.3,.3,w+.3,0x64513c);
}

// درخت‌ها
for(let i=0;i<90;i++){
 const x=(Math.random()-.5)*140;
 const z=(Math.random()-.5)*140;

 if(Math.hypot(x,z)<17)continue;

 makeBox(x,1,z,.6,2,.6,0x62462b);

 const tree=new THREE.Mesh(
  new THREE.ConeGeometry(2.2,6,7),
  new THREE.MeshStandardMaterial({color:0x315b32})
 );
 tree.position.set(x,4,z);
 scene.add(tree);
}

// صخره و کوه
for(let i=0;i<25;i++){
 const a=i/25*Math.PI*2;
 const r=110;

 const rock=new THREE.Mesh(
  new THREE.ConeGeometry(9+Math.random()*8,20+Math.random()*15,6),
  new THREE.MeshStandardMaterial({color:0x756b59})
 );
 rock.position.set(Math.cos(a)*r,10,Math.sin(a)*r);
 scene.add(rock);
}

// مدل واقعی سرباز
const MODEL_URL=
 "https://gobkit.com/freebies/human004/Rifleman.glb";

const loader=new THREE.GLTFLoader();

let originalModel=null;
let player=null;
let enemies=[];
let characterData=[];
let playerMixer=null;

let ready=false;
let dead=false;
let health=100;
let ammo=30;
let kills=0;
let angle=0;
let moveX=0;
let moveY=0;
let lastShot=0;

const clock=new THREE.Clock();
const raycaster=new THREE.Raycaster();

// پیدا کردن انیمیشن بر اساس نام
function findClip(clips,name){
 return clips.find(c=>c.name.toLowerCase()===name.toLowerCase())
 || clips.find(c=>c.name.toLowerCase().includes(name.toLowerCase()));
}

// ساخت شخصیت با اسکلت مستقل
function createCharacter(isEnemy,x,z){

 const model=THREE.SkeletonUtils.clone(originalModel);

 const character=new THREE.Group();
 character.add(model);

 model.updateMatrixWorld(true);

 const bounds=new THREE.Box3().setFromObject(model);
 const size=bounds.getSize(new THREE.Vector3());

 if(size.y>0){
  model.scale.setScalar(2.1/size.y);
 }

 model.updateMatrixWorld(true);

 const newBounds=new THREE.Box3().setFromObject(model);
 model.position.y-=newBounds.min.y;

 model.traverse(o=>{
  if(o.isMesh){
   o.castShadow=true;
   o.receiveShadow=true;
  }
 });

 character.position.set(x,0,z);
 character.userData.isEnemy=isEnemy;

 scene.add(character);

 let mixer=null;
 let actions={};
 let currentAction=null;

 if(originalAnimations.length){

  mixer=new THREE.AnimationMixer(model);

  ["idle","walk","run","attack","dead"].forEach(name=>{
   const clip=findClip(originalAnimations,name);
   if(clip){
    actions[name]=mixer.clipAction(clip);
   }
  });

  if(actions.idle){
   actions.idle.play();
   currentAction="idle";
  }else{
   const first=originalAnimations[0];
   actions.custom=mixer.clipAction(first);
   actions.custom.play();
   currentAction="custom";
  }
 }

 const data={
  root:character,
  model:model,
  mixer:mixer,
  actions:actions,
  current:currentAction,
  isEnemy:isEnemy,
  nextAttack:0
 };

 characterData.push(data);

 if(isEnemy)enemies.push(data);
 else player=data;

 return data;
}

let originalAnimations=[];

function playAnimation(data,name){
 if(!data || !data.actions[name])return;
 if(data.current===name)return;

 const next=data.actions[name];

 if(data.current && data.actions[data.current]){
  next.reset();
  next.play();
  next.crossFadeFrom(data.actions[data.current],.2,true);
 }else{
  next.reset();
  next.play();
 }

 data.current=name;
}

// بارگذاری مدل
loading.textContent="در حال دریافت مدل Rifleman...";

loader.load(
 MODEL_URL,

 function(gltf){

  originalModel=gltf.scene;
  originalAnimations=gltf.animations||[];

  player=createCharacter(false,0,0);

  for(let i=0;i<7;i++){
   let x=(Math.random()-.5)*80;
   let z=(Math.random()-.5)*80;

   if(Math.hypot(x,z)<22)x+=35;

   createCharacter(true,x,z);
  }

  ready=true;
  loading.style.display="none";

  message.textContent="AFGHAN BATTLE - شروع جنگ!";
  setTimeout(()=>message.style.display="none",2500);
 },

 function(xhr){
  if(xhr.total){
   loading.textContent=
   "بارگذاری مدل سرباز: "+
   Math.round(xhr.loaded/xhr.total*100)+"%";
  }
 },

 function(err){
  console.error(err);
  loading.textContent=
  "مدل سرباز بارگذاری نشد. اینترنت را بررسی کن و صفحه را تازه کن.";
 }
);

// جوی‌استیک
const joy=$("joy");
const stick=$("stick");

function updateJoystick(e){
 const r=joy.getBoundingClientRect();

 let dx=e.clientX-(r.left+r.width/2);
 let dy=e.clientY-(r.top+r.height/2);

 const distance=Math.min(43,Math.hypot(dx,dy));
 const a=Math.atan2(dy,dx);

 moveX=Math.cos(a)*distance/43;
 moveY=Math.sin(a)*distance/43;

 stick.style.left=(35+moveX*43)+"px";
 stick.style.top=(35+moveY*43)+"px";
}

joy.addEventListener("pointerdown",e=>{
 joy.setPointerCapture(e.pointerId);
 updateJoystick(e);
});

joy.addEventListener("pointermove",e=>{
 if(e.buttons)updateJoystick(e);
});

function resetJoystick(){
 moveX=0;
 moveY=0;
 stick.style.left="35px";
 stick.style.top="35px";
}

joy.addEventListener("pointerup",resetJoystick);
joy.addEventListener("pointercancel",resetJoystick);

// کنترل دوربین
const look=$("look");
let looking=false;
let oldX=0;

look.addEventListener("pointerdown",e=>{
 looking=true;
 oldX=e.clientX;
 look.setPointerCapture(e.pointerId);
});

look.addEventListener("pointermove",e=>{
 if(!looking)return;

 const dx=e.clientX-oldX;
 oldX=e.clientX;
 angle-=dx*.007;
});

look.addEventListener("pointerup",()=>looking=false);
look.addEventListener("pointercancel",()=>looking=false);

// تیراندازی
function shoot(){

 if(!ready || dead)return;

 if(ammo<=0){
  $("status").textContent="مهمات تمام شد!";
  return;
 }

 if(performance.now()-lastShot<350)return;

 lastShot=performance.now();
 ammo--;

 $("ammo").textContent=ammo;

 raycaster.setFromCamera(
  new THREE.Vector2(0,0),camera
 );

 const objects=[];

 enemies.forEach(e=>{
  e.model.traverse(o=>{
   if(o.isMesh)objects.push(o);
  });
 });

 const hits=raycaster.intersectObjects(objects,false);

 if(hits.length){

  let target=hits[0].object;
  let enemyData=null;

  while(target){
   enemyData=enemies.find(e=>e.root===target);
   if(enemyData)break;
   target=target.parent;
  }

  if(enemyData){
   const index=enemies.indexOf(enemyData);

   if(index>=0){
    scene.remove(enemyData.root);
    if(enemyData.mixer)enemyData.mixer.stopAllAction();

    enemies.splice(index,1);
    characterData=characterData.filter(d=>d!==enemyData);

    kills++;
    $("kills").textContent=kills;
    $("status").textContent="دشمن نابود شد!";
   }
  }
 }
}

$("fire").addEventListener("pointerdown",e=>{
 e.preventDefault();
 shoot();
});

// پر کردن مهمات
$("reload").addEventListener("pointerdown",e=>{
 e.preventDefault();

 if(!dead){
  ammo=30;
  $("ammo").textContent=ammo;
  $("status").textContent="مهمات پر شد";
 }
});

// پایان بازی
function gameOver(){
 if(dead)return;

 dead=true;
 message.style.display="block";
 message.textContent="GAME OVER";
 $("restart").style.display="block";
 $("status").textContent="بازی تمام شد";
}

// هوش مصنوعی دشمن و حرکت
function updateGame(dt){

 if(!ready)return;

 characterData.forEach(d=>{
  if(d.mixer)d.mixer.update(dt);
 });

 if(dead)return;

 const forward=new THREE.Vector3(
  -Math.sin(angle),0,-Math.cos(angle)
 );

 const right=new THREE.Vector3(
  Math.cos(angle),0,-Math.sin(angle)
 );

 const movement=new THREE.Vector3()
 .addScaledVector(right,moveX)
 .addScaledVector(forward,moveY);

 if(movement.lengthSq()>.01){

  movement.normalize();

  player.root.position.addScaledVector(movement,6*dt);

  player.root.position.x=THREE.MathUtils.clamp(
   player.root.position.x,-140,140
  );

  player.root.position.z=THREE.MathUtils.clamp(
   player.root.position.z,-140,140
  );

  player.root.rotation.y=Math.atan2(
   movement.x,movement.z
  );

  playAnimation(player,"walk");

 }else{
  playAnimation(player,"idle");
 }

 enemies.forEach(enemy=>{

  const direction=new THREE.Vector3().subVectors(
   player.root.position,enemy.root.position
  );

  const distance=direction.length();

  if(distance>2.1){

   direction.normalize();

   enemy.root.position.addScaledVector(
    direction,1.8*dt
   );

   enemy.root.rotation.y=Math.atan2(
    direction.x,direction.z
   );

   playAnimation(enemy,"walk");

  }else{

   playAnimation(enemy,"attack");

   health=Math.max(0,health-9*dt);

   $("health").textContent=
    "❤️ "+Math.floor(health);

   if(health<=0)gameOver();
  }
 });
}

// دوربین سوم شخص
function updateCamera(){

 if(!ready)return;

 const offset=new THREE.Vector3(
  Math.sin(angle)*8,
  4.5,
  Math.cos(angle)*8
 );

 camera.position.lerp(
  player.root.position.clone().add(offset),
  .13
 );

 camera.lookAt(
  player.root.position.x,
  player.root.position.y+1.1,
  player.root.position.z
 );
}

// اجرای بازی
function animate(){
 requestAnimationFrame(animate);

 const dt=Math.min(clock.getDelta(),.05);

 updateGame(dt);
 updateCamera();

 renderer.render(scene,camera);
}

animate();

// اندازه صفحه
window.addEventListener("resize",()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});

}catch(error){
 console.error(error);
 loading.style.display="block";
 loading.textContent="خطای بازی: "+error.message;
}

})();
</script>
</body>
</html>
